<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="互传图解">
<title>图片编解码器 · F2I</title>
<style>
:root{
  --bg:#0b1220; --card:#151d2e; --card2:#1b2438; --line:#26324a;
  --fg:#e8eefc; --dim:#8a9ab5; --accent:#4f8cff; --ok:#2ecc71; --warn:#ffb020; --bad:#ff5c6c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%,#16223a 0%,var(--bg) 60%);
  color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px);
  display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto;
}
h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.3px}
.sub{color:var(--dim);font-size:12.5px;margin-top:4px}
.tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;
}
.tab{
  border:0;background:transparent;color:var(--dim);padding:9px 10px;border-radius:10px;
  font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;
}
.tab.active{background:var(--accent);color:#fff}
.panel{display:none;flex-direction:column;gap:12px}
.panel.active{display:flex}
.drop{
  border:1.5px dashed var(--line);border-radius:18px;background:var(--card);
  padding:30px 20px;text-align:center;cursor:pointer;
  transition:.18s border-color,.18s background,.18s transform;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.drop:active{transform:scale(.985)}
.drop.hot{border-color:var(--accent);background:#18233a}
.t1{font-size:15px;font-weight:600}
.t2{font-size:12.5px;color:var(--dim);line-height:1.7}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;
  animation:in .2s ease-out;
}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13.5px}
.row .k{color:var(--dim);flex:0 0 auto}
.row .v{text-align:right;word-break:break-all;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.opt{display:flex;flex-direction:column;gap:10px}
.field{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:13px}
.field label{color:var(--dim);flex:0 0 auto}
.inp{
  flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;
  color:var(--fg);padding:8px 11px;font:inherit;font-size:13px;outline:none;
}
.inp:focus{border-color:var(--accent)}
.inp:disabled{opacity:.5}
.inp.sm{max-width:96px;text-align:right}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg);cursor:pointer}
.btn{
  display:block;width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;
  background:var(--accent);color:#fff;font-size:14.5px;font-weight:650;
  text-align:center;text-decoration:none;cursor:pointer;
}
.btn:active{opacity:.85}
.btn.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btnrow .btn{margin-top:0}
.err{display:none}
.err.show{display:block;border-color:#3a2230;background:#1e1622}
.errmsg{color:var(--bad);font-weight:600;font-size:14px;margin-bottom:6px}
.hint{color:var(--dim);font-size:12.5px;line-height:1.6}
.spin{width:24px;height:24px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.busy{display:none;align-items:center;gap:12px;justify-content:center;padding:16px}
.busy.show{display:flex}
.thumb{
  display:block;max-width:100%;max-height:180px;margin:10px auto 4px;border-radius:10px;
  border:1px solid var(--line);image-rendering:pixelated;background:#090e18;
}
.foot{margin-top:auto;color:#4d5a72;font-size:11.5px;text-align:center;padding-top:10px}
</style>
</head>
<body>
<div>
  <h1>图片编解码器</h1>
  <div class="sub">文件 ⇄ 无损 PNG · 支持自动压缩、分片与加密</div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="dec">解码（图 → 文件）</button>
  <button class="tab" data-tab="enc">编码（文件 → 图）</button>
</div>

<!-- 解码面板 -->
<section class="panel active" id="panel-dec">
  <div class="drop" id="dec-drop">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
    </svg>
    <div class="t1">点这里选择 PNG 图片（支持多选分片）</div>
    <div class="t2">可直接把图拖进来，或按 Ctrl/⌘ + V 粘贴</div>
  </div>
  <input type="file" id="dec-file" accept="image/png,image/*" multiple hidden>

  <div class="card opt">
    <div class="field">
      <label for="dec-pw">解密口令</label>
      <input class="inp" id="dec-pw" type="password" placeholder="未加密图片可留空">
    </div>
  </div>

  <div class="busy" id="dec-busy"><div class="spin"></div><div class="hint" id="dec-busy-txt">正在后台解码…</div></div>
  <div id="dec-chunks"></div>
  <div id="dec-out"></div>
  <div class="card err" id="dec-err">
    <div class="errmsg"></div>
    <div class="hint"></div>
    <button class="btn ghost" id="dec-retry" style="display:none">用当前口令重新解密</button>
  </div>
</section>

<!-- 编码面板 -->
<section class="panel" id="panel-enc">
  <div class="drop" id="enc-drop">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>
    </svg>
    <div class="t1">点这里选择要发送的文件</div>
    <div class="t2">自动无损压缩，超出单图上限自动分片</div>
  </div>
  <input type="file" id="enc-file" hidden>

  <div class="card opt">
    <label class="chk"><input type="checkbox" id="enc-comp" checked> 自动压缩（变小时启用 Deflate）</label>
    <div class="field">
      <label for="enc-part">单图上限 (MB)</label>
      <input class="inp sm" id="enc-part" type="number" step="0.5" min="0.5" max="50" value="4.7">
    </div>
    <div class="field">
      <label for="enc-pw">加密口令</label>
      <input class="inp" id="enc-pw" type="password" placeholder="可选（AES-256-GCM）">
    </div>
    <div class="hint warn" id="crypto-note" style="display:none">
      当前是 HTTP 非安全上下文，浏览器禁用了 WebCrypto，暂无法在网页端加解密（明文传输不受影响；如需加密请用 PC 端或 Android 互传助手）。
    </div>
  </div>

  <div class="busy" id="enc-busy"><div class="spin"></div><div class="hint">正在后台编码…</div></div>
  <div id="enc-out"></div>
  <div class="card err" id="enc-err"><div class="errmsg"></div><div class="hint"></div></div>
</section>

<div class="foot">F2I1 / F2I2 / F2I3 · 全程本地 Worker 处理，不上传任何数据</div>

<script id="core-script">
// __CORE_MJS_START__
// core.mjs — 零依赖编解码核心（Node、浏览器、Web Worker 通用）

const MAGIC1 = 'F2I1';
const MAGIC2 = 'F2I2';
const MAGIC3 = 'F2I3';
const HEAD1 = 12;
const HEAD2 = 14;
const HEAD3 = 15;
const CHUNK_HEAD = 12;

const F3_COMPRESSED = 0x01;
const F3_ENCRYPTED = 0x02;
const F3_CHUNKED = 0x04;

const DEFAULT_PART_BYTES = Math.floor(4.7 * 1000 * 1000); // 单图载荷上限 ~4.7 MB（确保 PNG < 5 MB）
const PBKDF2_ITERS = 100000;

const CRC_TBL = (() => {
  const t = new Int32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  return t;
})();

function crc32(buf, start = 0, end = buf.length) {
  let c = -1;
  for (let i = start; i < end; i++) c = CRC_TBL[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
  return (c ^ -1) >>> 0;
}

function sanitizeFilename(raw) {
  const s = String(raw || '')
    .replace(/\\/g, '/')
    .split('/')
    .pop()
    .replace(/[\x00-\x1f\x7f]/g, '')
    .replace(/[\\/:*?"<>|]/g, '_')
    .trim();
  if (!s || s === '.' || s === '..') return 'decoded_' + Date.now() + '.bin';
  return s;
}

function bytesToHex(u8) {
  let out = '';
  for (let i = 0; i < u8.length; i++) out += u8[i].toString(16).padStart(2, '0');
  return out;
}

function hexToBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16);
  return out;
}

function concatBytes(parts, total) {
  if (total === undefined) {
    total = 0;
    for (const p of parts) total += p.length;
  }
  const out = new Uint8Array(total);
  let o = 0;
  for (const p of parts) {
    out.set(p, o);
    o += p.length;
  }
  return out;
}

/* ---------------- PNG 底层解析与构建 ---------------- */

function parsePngChunks(u8) {
  if (
    u8.length < 8 ||
    u8[0] !== 0x89 || u8[1] !== 0x50 || u8[2] !== 0x4e || u8[3] !== 0x47 ||
    u8[4] !== 0x0d || u8[5] !== 0x0a || u8[6] !== 0x1a || u8[7] !== 0x0a
  ) {
    throw new Error('不是 PNG 文件');
  }
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let off = 8;
  let w = 0, h = 0, depth = 0, ctype = 0, interlace = 0;
  let ihdrSeen = false;
  let iendSeen = false;
  let palette = null;
  const idat = [];
  let idatLen = 0;

  while (off + 8 <= u8.length) {
    const len = dv.getUint32(off);
    if (off + 12 + len > u8.length) throw new Error('PNG 数据块越界（文件可能被截断）');
    const type = String.fromCharCode(u8[off + 4], u8[off + 5], u8[off + 6], u8[off + 7]);
    if (type === 'IHDR') {
      if (len < 13) throw new Error('PNG IHDR 块损坏');
      w = dv.getUint32(off + 8);
      h = dv.getUint32(off + 12);
      depth = u8[off + 16];
      ctype = u8[off + 17];
      interlace = u8[off + 20];
      ihdrSeen = true;
    } else if (type === 'PLTE') {
      palette = u8.subarray(off + 8, off + 8 + len);
    } else if (type === 'IDAT') {
      const d = u8.subarray(off + 8, off + 8 + len);
      idat.push(d);
      idatLen += d.length;
    } else if (type === 'IEND') {
      iendSeen = true;
      break;
    }
    off += 12 + len;
  }

  if (!ihdrSeen || w <= 0 || h <= 0) throw new Error('PNG 尺寸信息缺失或异常');
  if (!iendSeen) throw new Error('PNG 文件不完整（缺少 IEND 结束块）');
  if (interlace) throw new Error('不支持隔行扫描 PNG');
  if (!idatLen) throw new Error('PNG 缺少 IDAT 图像数据');

  return { w, h, depth, ctype, interlace, palette, compressed: concatBytes(idat, idatLen) };
}

function unfilterScanlines(raw, stride, h, bpp) {
  const expected = (stride + 1) * h;
  if (raw.length < expected) throw new Error('PNG 像素数据不完整（期望 ' + expected + ' B，实得 ' + raw.length + ' B）');
  const out = new Uint8Array(stride * h);
  let pos = 0;
  for (let y = 0; y < h; y++) {
    const ft = raw[pos++];
    const rowStart = y * stride;
    const prevStart = rowStart - stride;
    for (let x = 0; x < stride; x++) {
      const v = raw[pos++];
      const a = x >= bpp ? out[rowStart + x - bpp] : 0;
      const b = y > 0 ? out[prevStart + x] : 0;
      const c = (y > 0 && x >= bpp) ? out[prevStart + x - bpp] : 0;
      let r;
      switch (ft) {
        case 0: r = v; break;
        case 1: r = (v + a) & 255; break;
        case 2: r = (v + b) & 255; break;
        case 3: r = (v + ((a + b) >> 1)) & 255; break;
        case 4: {
          const p = a + b - c;
          const pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c);
          r = (v + (pa <= pb && pa <= pc ? a : (pb <= pc ? b : c))) & 255;
          break;
        }
        default: throw new Error('PNG 滤镜类型异常: ' + ft);
      }
      out[rowStart + x] = r;
    }
  }
  return out;
}

function indexAt(row, rowStart, x, depth) {
  if (depth === 8) return row[rowStart + x];
  if (depth === 4) {
    const b = row[rowStart + (x >> 1)];
    return (x & 1) === 0 ? (b >> 4) & 0x0f : b & 0x0f;
  }
  if (depth === 2) {
    const b = row[rowStart + (x >> 2)];
    return (b >> ((3 - (x & 3)) * 2)) & 0x03;
  }
  if (depth === 1) {
    const b = row[rowStart + (x >> 3)];
    return (b >> (7 - (x & 7))) & 0x01;
  }
  throw new Error('不支持的调色板位深: ' + depth);
}

function rawPixelsToRgb(raw, w, h, depth, ctype, palette) {
  // 调色板索引色 (ctype = 3)
  if (ctype === 3) {
    if (!palette) throw new Error('调色板 PNG 缺少 PLTE 块');
    if (depth !== 1 && depth !== 2 && depth !== 4 && depth !== 8) {
      throw new Error('不支持的调色板位深: ' + depth);
    }
    const rowBytes = Math.ceil((w * depth) / 8);
    const px = unfilterScanlines(raw, rowBytes, h, 1);
    const rgb = new Uint8Array(w * h * 3);
    let o = 0;
    for (let y = 0; y < h; y++) {
      const rowStart = y * rowBytes;
      for (let x = 0; x < w; x++) {
        const idx = indexAt(px, rowStart, x, depth);
        const p = idx * 3;
        if (p + 2 < palette.length) {
          rgb[o] = palette[p];
          rgb[o + 1] = palette[p + 1];
          rgb[o + 2] = palette[p + 2];
        }
        o += 3;
      }
    }
    return { w, h, ctype, depth, rgb };
  }

  if (depth !== 8 && depth !== 16) throw new Error('只支持 8/16bit PNG（当前 ' + depth + 'bit）');
  const chMap = { 0: 1, 2: 3, 4: 2, 6: 4 };
  const ch = chMap[ctype];
  if (!ch) throw new Error('不支持的 PNG 颜色类型: ' + ctype);

  const bytesPerSample = depth === 16 ? 2 : 1;
  const bpp = ch * bytesPerSample;
  const stride = w * bpp;
  const px = unfilterScanlines(raw, stride, h, bpp);

  if (depth === 8 && ch === 3) return { w, h, ctype, depth, rgb: px };

  const rgb = new Uint8Array(w * h * 3);
  let o = 0;
  if (depth === 8) {
    for (let i = 0; i < w * h; i++) {
      const s = i * ch;
      if (ch >= 3) {
        rgb[o] = px[s];
        rgb[o + 1] = px[s + 1];
        rgb[o + 2] = px[s + 2];
      } else {
        // 灰度 / 灰度+Alpha：将单通道亮度复制到 RGB 三通道
        rgb[o] = px[s];
        rgb[o + 1] = px[s];
        rgb[o + 2] = px[s];
      }
      o += 3;
    }
  } else {
    for (let i = 0; i < w * h; i++) {
      const s = i * bpp;
      if (ch >= 3) {
        rgb[o] = px[s];
        rgb[o + 1] = px[s + 2];
        rgb[o + 2] = px[s + 4];
      } else {
        rgb[o] = px[s];
        rgb[o + 1] = px[s];
        rgb[o + 2] = px[s];
      }
      o += 3;
    }
  }
  return { w, h, ctype, depth, rgb };
}

function buildRawScanlines(rgb, w, h) {
  const stride = w * 3;
  const raw = new Uint8Array((stride + 1) * h);
  for (let y = 0; y < h; y++) {
    raw[y * (stride + 1)] = 0; // Filter: None
    raw.set(rgb.subarray(y * stride, (y + 1) * stride), y * (stride + 1) + 1);
  }
  return raw;
}

function pngChunk(type, data) {
  const out = new Uint8Array(12 + data.length);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, data.length);
  out[4] = type.charCodeAt(0);
  out[5] = type.charCodeAt(1);
  out[6] = type.charCodeAt(2);
  out[7] = type.charCodeAt(3);
  out.set(data, 8);
  dv.setUint32(8 + data.length, crc32(out, 4, 8 + data.length));
  return out;
}

function buildPngFromIdat(w, h, idat) {
  const sig = new Uint8Array([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);
  const ihdr = new Uint8Array(13);
  const dv = new DataView(ihdr.buffer);
  dv.setUint32(0, w);
  dv.setUint32(4, h);
  ihdr[8] = 8; // 8bit
  ihdr[9] = 2; // RGB
  return concatBytes([sig, pngChunk('IHDR', ihdr), pngChunk('IDAT', idat), pngChunk('IEND', new Uint8Array(0))]);
}

function buildRgbLayout(packed, cols = 0) {
  const npix = Math.ceil(packed.length / 3);
  const w = cols > 0 ? cols : Math.max(1, Math.ceil(Math.sqrt(npix)));
  const h = Math.max(1, Math.ceil(npix / w));
  const rgb = new Uint8Array(w * h * 3);
  rgb.set(packed, 0);
  return { w, h, rgb };
}

/* ---------------- 载荷封装与解包 (F2I1 / F2I2 / F2I3) ---------------- */

function packF2I2(payload, name) {
  const nb = name ? new TextEncoder().encode(String(name)) : new Uint8Array(0);
  if (nb.length > 65535) throw new Error('文件名过长');
  const out = new Uint8Array(HEAD2 + nb.length + payload.length);
  const dv = new DataView(out.buffer);
  out[0] = 0x46; out[1] = 0x32; out[2] = 0x49; out[3] = 0x32; // F2I2
  dv.setUint16(4, nb.length);
  dv.setUint32(6, payload.length);
  dv.setUint32(10, crc32(payload));
  out.set(nb, HEAD2);
  out.set(payload, HEAD2 + nb.length);
  return out;
}

function packF2I3Part({ flags, nameBytes, body, transferId, partIndex, partTotal }) {
  if (nameBytes.length > 65535) throw new Error('文件名过长');
  const chunked = (flags & F3_CHUNKED) !== 0;
  const fixedHead = HEAD3 + (chunked ? CHUNK_HEAD : 0);
  const out = new Uint8Array(fixedHead + nameBytes.length + body.length);
  const dv = new DataView(out.buffer);
  out[0] = 0x46; out[1] = 0x32; out[2] = 0x49; out[3] = 0x33; // F2I3
  out[4] = flags & 0xff;
  dv.setUint16(5, nameBytes.length);
  dv.setUint32(7, body.length);
  dv.setUint32(11, crc32(body));
  if (chunked) {
    if (!transferId || transferId.length !== 8) throw new Error('无效的 transferId');
    out.set(transferId, HEAD3);
    dv.setUint16(HEAD3 + 8, partIndex);
    dv.setUint16(HEAD3 + 10, partTotal);
  }
  out.set(nameBytes, fixedHead);
  out.set(body, fixedHead + nameBytes.length);
  return out;
}

function inspectPayloadHeader(bytes) {
  if (bytes.length < HEAD1) throw new Error('数据长度不足，没有载荷头');
  const m4 = String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]);
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

  if (m4 === MAGIC3) {
    if (bytes.length < HEAD3) throw new Error('F2I3 头部不完整');
    const flags = bytes[4];
    const nameLen = dv.getUint16(5);
    const bodyLen = dv.getUint32(7);
    const bodyCrc = dv.getUint32(11);
    const chunked = (flags & F3_CHUNKED) !== 0;
    const fixedHead = HEAD3 + (chunked ? CHUNK_HEAD : 0);
    if (bytes.length < fixedHead) throw new Error('F2I3 分片头不完整');

    let transferIdHex = '';
    let partIndex = 0;
    let partTotal = 1;
    if (chunked) {
      transferIdHex = bytesToHex(bytes.subarray(HEAD3, HEAD3 + 8));
      partIndex = dv.getUint16(HEAD3 + 8);
      partTotal = dv.getUint16(HEAD3 + 10);
      if (partTotal < 2 || partIndex >= partTotal) throw new Error('F2I3 分片索引异常');
    }
    const nameStart = fixedHead;
    const bodyOffset = nameStart + nameLen;
    if (bodyOffset + bodyLen > bytes.length) throw new Error('长度字段越界，图片可能被裁剪或损坏');
    const name = new TextDecoder().decode(bytes.subarray(nameStart, bodyOffset));
    return {
      version: 3,
      flags,
      compressed: (flags & F3_COMPRESSED) !== 0,
      encrypted: (flags & F3_ENCRYPTED) !== 0,
      chunked,
      transferIdHex,
      partIndex,
      partTotal,
      name,
      bodyOffset,
      bodyLen,
      bodyCrc,
      totalPackedLen: bodyOffset + bodyLen,
    };
  }

  if (m4 === MAGIC2) {
    if (bytes.length < HEAD2) throw new Error('F2I2 头部不完整');
    const nameLen = dv.getUint16(4);
    const bodyLen = dv.getUint32(6);
    const bodyCrc = dv.getUint32(10);
    const bodyOffset = HEAD2 + nameLen;
    if (bodyOffset + bodyLen > bytes.length) throw new Error('长度字段越界，图片可能被裁剪或损坏');
    const name = new TextDecoder().decode(bytes.subarray(HEAD2, bodyOffset));
    return {
      version: 2,
      flags: 0,
      compressed: false,
      encrypted: false,
      chunked: false,
      transferIdHex: '',
      partIndex: 0,
      partTotal: 1,
      name,
      bodyOffset,
      bodyLen,
      bodyCrc,
      totalPackedLen: bodyOffset + bodyLen,
    };
  }

  if (m4 === MAGIC1) {
    const bodyLen = dv.getUint32(4);
    const bodyCrc = dv.getUint32(8);
    const bodyOffset = HEAD1;
    if (bodyOffset + bodyLen > bytes.length) throw new Error('长度字段越界，图片可能被裁剪或损坏');
    return {
      version: 1,
      flags: 0,
      compressed: false,
      encrypted: false,
      chunked: false,
      transferIdHex: '',
      partIndex: 0,
      partTotal: 1,
      name: '',
      bodyOffset,
      bodyLen,
      bodyCrc,
      totalPackedLen: bodyOffset + bodyLen,
    };
  }

  throw new Error('这张图里没有本工具的载荷（找不到 F2I1/F2I2/F2I3 头）');
}

function unpackRawBody(bytes) {
  const header = inspectPayloadHeader(bytes);
  const body = bytes.subarray(header.bodyOffset, header.bodyOffset + header.bodyLen);
  const real = crc32(body);
  if (real !== header.bodyCrc) {
    throw new Error('CRC32 校验失败: 期望 ' + header.bodyCrc.toString(16) + ' 实得 ' + real.toString(16));
  }
  return { ...header, body: new Uint8Array(body) };
}

/* ---------------- Web Streams / WebCrypto 异步辅助（浏览器 & Node 通用） ---------------- */

async function deflateBytes(u8) {
  const cs = new CompressionStream('deflate');
  const stream = new Blob([u8]).stream().pipeThrough(cs);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function inflateBytes(u8) {
  const ds = new DecompressionStream('deflate');
  const stream = new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function deriveAesKey(password, salt, usage) {
  const subtle = globalThis.crypto && globalThis.crypto.subtle;
  if (!subtle) {
    throw new Error('当前环境不支持 WebCrypto（HTTP 局域网网页无法加解密，请使用 PC 端或 Android 互传助手）');
  }
  const baseKey = await subtle.importKey(
    'raw',
    new TextEncoder().encode(password),
    'PBKDF2',
    false,
    ['deriveKey']
  );
  return subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: PBKDF2_ITERS, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    [usage]
  );
}

async function encryptBytes(u8, password) {
  const subtle = globalThis.crypto && globalThis.crypto.subtle;
  if (!subtle) {
    throw new Error('当前环境不支持 WebCrypto（HTTP 局域网网页无法加密，请留空口令或使用 localhost/HTTPS）');
  }
  const salt = globalThis.crypto.getRandomValues(new Uint8Array(16));
  const iv = globalThis.crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveAesKey(password, salt, 'encrypt');
  const cipher = new Uint8Array(await subtle.encrypt({ name: 'AES-GCM', iv }, key, u8));
  return concatBytes([salt, iv, cipher], 28 + cipher.length);
}

async function decryptBytes(u8, password) {
  if (!password) throw new Error('该图片已加密，需要提供解密口令');
  if (u8.length < 28 + 16) throw new Error('加密数据长度异常');
  const salt = u8.subarray(0, 16);
  const iv = u8.subarray(16, 28);
  const cipher = u8.subarray(28);
  const key = await deriveAesKey(password, salt, 'decrypt');
  try {
    const plain = await globalThis.crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
    return new Uint8Array(plain);
  } catch {
    throw new Error('解密失败：口令错误或数据被篡改');
  }
}

async function decodePngBytes(u8) {
  const { w, h, depth, ctype, palette, compressed } = parsePngChunks(u8);
  const raw = await inflateBytes(compressed);
  return rawPixelsToRgb(raw, w, h, depth, ctype, palette);
}

async function encodePngBytes(rgb, w, h) {
  const raw = buildRawScanlines(rgb, w, h);
  const idat = await deflateBytes(raw);
  return buildPngFromIdat(w, h, idat);
}

async function encodeFileToPartsAsync(dataU8, name, opts = {}) {
  const compress = opts.compress !== false;
  const password = opts.password || '';
  const maxPartBytes = opts.maxPartBytes || DEFAULT_PART_BYTES;
  const cols = opts.cols || 0;

  let stream = dataU8;
  let flags = 0;

  if (compress) {
    const deflated = await deflateBytes(stream);
    if (deflated.length < stream.length) {
      stream = deflated;
      flags |= F3_COMPRESSED;
    }
  }

  if (password) {
    stream = await encryptBytes(stream, password);
    flags |= F3_ENCRYPTED;
  }

  const nameBytes = name ? new TextEncoder().encode(String(name)) : new Uint8Array(0);
  if (stream.length <= maxPartBytes) {
    const packed = flags === 0
      ? packF2I2(stream, name)
      : packF2I3Part({ flags, nameBytes, body: stream });
    const { w, h, rgb } = buildRgbLayout(packed, cols);
    const png = await encodePngBytes(rgb, w, h);
    return [{ png, w, h, partIndex: 0, partTotal: 1, flags, transferIdHex: '', packedSize: packed.length }];
  }

  flags |= F3_CHUNKED;
  const partTotal = Math.ceil(stream.length / maxPartBytes);
  if (partTotal > 65535) throw new Error('分片数量超过上限 (65535)');
  const transferId = globalThis.crypto.getRandomValues(new Uint8Array(8));
  const transferIdHex = bytesToHex(transferId);
  const parts = [];

  for (let i = 0; i < partTotal; i++) {
    const start = i * maxPartBytes;
    const end = Math.min(stream.length, start + maxPartBytes);
    const chunkBody = stream.subarray(start, end);
    const packed = packF2I3Part({
      flags,
      nameBytes,
      body: chunkBody,
      transferId,
      partIndex: i,
      partTotal,
    });
    const { w, h, rgb } = buildRgbLayout(packed, cols);
    const png = await encodePngBytes(rgb, w, h);
    parts.push({ png, w, h, partIndex: i, partTotal, flags, transferIdHex, packedSize: packed.length });
  }
  return parts;
}

async function assembleChunksAsync(partBodies, flags, password = '') {
  let stream = partBodies.length === 1 ? partBodies[0] : concatBytes(partBodies);
  if ((flags & F3_ENCRYPTED) !== 0) stream = await decryptBytes(stream, password);
  if ((flags & F3_COMPRESSED) !== 0) stream = await inflateBytes(stream);
  return stream;
}

async function decodeFileBytes(u8, password = '') {
  const { w, h, ctype, depth, rgb } = await decodePngBytes(u8);
  const info = unpackRawBody(rgb);
  if (info.chunked) {
    return { w, h, ctype, depth, ...info, payload: null };
  }
  const payload = await assembleChunksAsync([info.body], info.flags, password);
  return { w, h, ctype, depth, ...info, payload };
}
// __CORE_MJS_END__
</script>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const human = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB';

  // Tab 切换
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      $('#panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  // 非安全上下文提示
  if (!(globalThis.crypto && globalThis.crypto.subtle)) {
    $('#crypto-note').style.display = 'block';
    $('#enc-pw').disabled = true;
  }

  // 内联 Web Worker（避免大图编码/解码卡住 UI）
  let worker = null;
  let reqId = 1;
  const waiters = new Map();

  function initWorker() {
    if (typeof Worker === 'undefined') return null;
    try {
      const coreCode = $('#core-script').textContent;
      const workerGlue = `
self.onmessage = async (e) => {
  const { id, op, payload } = e.data;
  try {
    if (op === 'decode') {
      const res = await decodeFileBytes(new Uint8Array(payload.buf), payload.password);
      const out = {
        w: res.w, h: res.h, ctype: res.ctype, depth: res.depth,
        version: res.version, flags: res.flags, compressed: res.compressed,
        encrypted: res.encrypted, chunked: res.chunked,
        transferIdHex: res.transferIdHex, partIndex: res.partIndex, partTotal: res.partTotal,
        name: res.name,
        bodyBuf: res.chunked ? res.body.buffer : null,
        payloadBuf: res.payload ? res.payload.buffer : null,
      };
      const xfer = [];
      if (out.bodyBuf) xfer.push(out.bodyBuf);
      if (out.payloadBuf) xfer.push(out.payloadBuf);
      self.postMessage({ id, ok: true, res: out }, xfer);
    } else if (op === 'assemble') {
      const bodies = payload.buffers.map(b => new Uint8Array(b));
      const out = await assembleChunksAsync(bodies, payload.flags, payload.password);
      self.postMessage({ id, ok: true, res: { payloadBuf: out.buffer } }, [out.buffer]);
    } else if (op === 'encode') {
      const parts = await encodeFileToPartsAsync(new Uint8Array(payload.buf), payload.name, payload.opts);
      const out = parts.map(p => ({
        w: p.w, h: p.h, partIndex: p.partIndex, partTotal: p.partTotal,
        flags: p.flags, transferIdHex: p.transferIdHex, pngBuf: p.png.buffer
      }));
      self.postMessage({ id, ok: true, res: out }, out.map(p => p.pngBuf));
    }
  } catch (err) {
    self.postMessage({ id, ok: false, error: err && err.message ? err.message : String(err) });
  }
};`;
      const blob = new Blob([coreCode + '\n' + workerGlue], { type: 'application/javascript' });
      const w = new Worker(URL.createObjectURL(blob));
      w.onmessage = ev => {
        const { id, ok, res, error } = ev.data;
        const job = waiters.get(id);
        if (!job) return;
        waiters.delete(id);
        if (ok) job.resolve(res);
        else job.reject(new Error(error));
      };
      w.onerror = () => { worker = null; };
      return w;
    } catch {
      return null;
    }
  }
  worker = initWorker();

  async function runOp(op, payload, transfer = []) {
    if (worker) {
      const id = reqId++;
      return new Promise((resolve, reject) => {
        waiters.set(id, { resolve, reject });
        worker.postMessage({ id, op, payload }, transfer);
      });
    }
    // Fallback：主线程直接执行
    if (op === 'decode') {
      const res = await decodeFileBytes(new Uint8Array(payload.buf), payload.password);
      return {
        ...res,
        bodyBuf: res.chunked ? res.body.buffer : null,
        payloadBuf: res.payload ? res.payload.buffer : null,
      };
    }
    if (op === 'assemble') {
      const out = await assembleChunksAsync(payload.buffers.map(b => new Uint8Array(b)), payload.flags, payload.password);
      return { payloadBuf: out.buffer };
    }
    if (op === 'encode') {
      const parts = await encodeFileToPartsAsync(new Uint8Array(payload.buf), payload.name, payload.opts);
      return parts.map(p => ({ ...p, pngBuf: p.png.buffer }));
    }
  }

  /* ---------------- 解码逻辑 ---------------- */
  const decDrop = $('#dec-drop'), decFile = $('#dec-file'), decOut = $('#dec-out'),
        decChunks = $('#dec-chunks'), decBusy = $('#dec-busy'), decBusyTxt = $('#dec-busy-txt'),
        decErr = $('#dec-err'), decRetry = $('#dec-retry'), decPw = $('#dec-pw');

  const chunkGroups = new Map(); // transferIdHex -> { name, flags, partTotal, parts: Map<idx, Uint8Array> }
  let pendingRetryFiles = null;

  function showDecErr(msg, hint, allowRetry = false) {
    decErr.querySelector('.errmsg').textContent = msg;
    decErr.querySelector('.hint').textContent = hint || '';
    decRetry.style.display = allowRetry ? 'block' : 'none';
    decErr.classList.add('show');
  }
  function clearDecErr() { decErr.classList.remove('show'); decRetry.style.display = 'none'; }

  function renderChunks() {
    if (!chunkGroups.size) { decChunks.innerHTML = ''; return; }
    let html = '';
    for (const [tid, g] of chunkGroups.entries()) {
      const got = g.parts.size;
      html += `<div class="card">
        <div class="row"><span class="k">分片传输</span><span class="v">${esc(g.name || tid)}</span></div>
        <div class="row"><span class="k">进度</span><span class="v warn">${got} / ${g.partTotal} 片（等待其余分片）</span></div>
        <button class="btn ghost" data-clear-tid="${esc(tid)}">清除此分片缓存</button>
      </div>`;
    }
    decChunks.innerHTML = html;
    decChunks.querySelectorAll('[data-clear-tid]').forEach(b => {
      b.addEventListener('click', () => { chunkGroups.delete(b.dataset.clearTid); renderChunks(); });
    });
  }

  function renderDecodedFile(name, payloadU8, metaText, ms) {
    const fname = sanitizeFilename(name);
    const blob = new Blob([payloadU8], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      `<div class="row"><span class="k">文件名</span><span class="v">${esc(fname)}</span></div>` +
      `<div class="row"><span class="k">大小</span><span class="v">${human(payloadU8.length)}</span></div>` +
      `<div class="row"><span class="k">详情</span><span class="v">${esc(metaText)}</span></div>` +
      `<div class="row"><span class="k">校验</span><span class="v ok">CRC32 通过</span></div>` +
      `<div class="row"><span class="k">耗时</span><span class="v">${ms} ms</span></div>` +
      `<a class="btn">保存文件</a>`;
    const dl = card.querySelector('a.btn');
    dl.href = url;
    dl.download = fname;
    dl.addEventListener('click', () => setTimeout(() => URL.revokeObjectURL(url), 60000));
    decOut.prepend(card);
  }

  async function handleDecodeFiles(fileList) {
    const files = Array.from(fileList || []).filter(Boolean);
    if (!files.length) return;
    clearDecErr();
    pendingRetryFiles = null;
    decBusy.classList.add('show');

    try {
      for (let idx = 0; idx < files.length; idx++) {
        const f = files[idx];
        decBusyTxt.textContent = files.length > 1 ? `正在解码第 ${idx + 1}/${files.length} 张…` : '正在后台解码…';
        const buf = await f.arrayBuffer();
        const t0 = performance.now();
        const res = await runOp('decode', { buf, password: decPw.value }, [buf]);

        if (res.chunked) {
          let g = chunkGroups.get(res.transferIdHex);
          if (!g) {
            g = { name: res.name, flags: res.flags, partTotal: res.partTotal, parts: new Map() };
            chunkGroups.set(res.transferIdHex, g);
          }
          g.parts.set(res.partIndex, new Uint8Array(res.bodyBuf));
          renderChunks();

          if (g.parts.size === g.partTotal) {
            const ordered = [];
            for (let i = 0; i < g.partTotal; i++) ordered.push(g.parts.get(i).buffer.slice(0));
            const assembled = await runOp(
              'assemble',
              { buffers: ordered, flags: g.flags, password: decPw.value },
              ordered
            );
            chunkGroups.delete(res.transferIdHex);
            renderChunks();
            const ms = Math.round(performance.now() - t0);
            const tags = [`${g.partTotal} 分片合并`];
            if (res.compressed) tags.push('已解压');
            if (res.encrypted) tags.push('已解密');
            renderDecodedFile(g.name, new Uint8Array(assembled.payloadBuf), `${res.w}×${res.h} · ${tags.join(' · ')}`, ms);
          }
        } else {
          const ms = Math.round(performance.now() - t0);
          const tags = [`F2I${res.version}`];
          if (res.compressed) tags.push('已解压');
          if (res.encrypted) tags.push('已解密');
          renderDecodedFile(res.name, new Uint8Array(res.payloadBuf), `${res.w}×${res.h} · ${tags.join(' · ')}`, ms);
        }
      }
    } catch (e) {
      const m = e.message || String(e);
      let hint = '';
      let allowRetry = false;
      if (/不是 PNG/.test(m)) hint = '这张图已被转成其他格式（JPG/HEIC 等），请确认传输时未做有损压缩。';
      else if (/口令|解密/.test(m)) { hint = '请在上方输入正确解密口令后点击重试。'; pendingRetryFiles = files; allowRetry = true; }
      else if (/WebCrypto/.test(m)) hint = m;
      else if (/CRC32/.test(m)) hint = '像素数据被改动或缩放，校验未通过。';
      else if (/没有本工具/.test(m)) hint = '这张图不包含 F2I1/F2I2/F2I3 载荷。';
      showDecErr(m, hint, allowRetry);
    } finally {
      decBusy.classList.remove('show');
    }
  }

  decRetry.addEventListener('click', () => {
    if (pendingRetryFiles) handleDecodeFiles(pendingRetryFiles);
  });
  decDrop.addEventListener('click', () => decFile.click());
  decFile.addEventListener('change', e => { handleDecodeFiles(e.target.files); decFile.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => decDrop.addEventListener(ev, e => { e.preventDefault(); decDrop.classList.add('hot'); }));
  ['dragleave', 'drop'].forEach(ev => decDrop.addEventListener(ev, e => { e.preventDefault(); decDrop.classList.remove('hot'); }));
  decDrop.addEventListener('drop', e => handleDecodeFiles(e.dataTransfer.files));

  document.addEventListener('paste', e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    const files = [];
    for (const it of items) {
      if (it.type.startsWith('image/')) {
        const f = it.getAsFile();
        if (f) files.push(f);
      }
    }
    if (files.length) {
      e.preventDefault();
      handleDecodeFiles(files);
    }
  });

  /* ---------------- 编码逻辑 ---------------- */
  const encDrop = $('#enc-drop'), encFile = $('#enc-file'), encOut = $('#enc-out'),
        encBusy = $('#enc-busy'), encErr = $('#enc-err'), encComp = $('#enc-comp'),
        encPart = $('#enc-part'), encPw = $('#enc-pw');

  function showEncErr(msg) {
    encErr.querySelector('.errmsg').textContent = msg;
    encErr.querySelector('.hint').textContent = '';
    encErr.classList.add('show');
  }

  async function handleEncodeFile(file) {
    if (!file) return;
    encErr.classList.remove('show');
    encOut.innerHTML = '';
    encBusy.classList.add('show');

    try {
      const partMb = Math.max(0.5, parseFloat(encPart.value) || 4.7);
      const buf = await file.arrayBuffer();
      const t0 = performance.now();
      const parts = await runOp('encode', {
        buf,
        name: file.name,
        opts: {
          compress: encComp.checked,
          password: encPw.value,
          maxPartBytes: Math.floor(partMb * 1000 * 1000),
        },
      }, [buf]);
      const ms = Math.round(performance.now() - t0);
      const base = file.name.replace(/\.[^.]+$/, '') || file.name;

      for (const p of parts) {
        const pngU8 = new Uint8Array(p.pngBuf);
        const blob = new Blob([pngU8], { type: 'image/png' });
        const url = URL.createObjectURL(blob);
        const outName = parts.length > 1 ? `${base}.part${p.partIndex + 1}of${p.partTotal}.png` : `${base}.png`;
        const tags = [];
        if (p.flags & F3_COMPRESSED) tags.push('已压缩');
        if (p.flags & F3_ENCRYPTED) tags.push('已加密');
        if (parts.length > 1) tags.push(`分片 ${p.partIndex + 1}/${p.partTotal}`);

        const card = document.createElement('div');
        card.className = 'card';
        const canCopy = !!(navigator.clipboard && navigator.clipboard.write && typeof ClipboardItem !== 'undefined');
        card.innerHTML =
          `<div class="row"><span class="k">原文件</span><span class="v">${esc(file.name)} (${human(file.size)})</span></div>` +
          `<div class="row"><span class="k">图片</span><span class="v">${p.w} × ${p.h} · ${human(pngU8.length)}</span></div>` +
          `<div class="row"><span class="k">状态</span><span class="v ok">${esc(tags.join(' · ') || 'F2I2 原样封装')} · ${ms} ms</span></div>` +
          `<img class="thumb" alt="encoded">` +
          `<div class="${canCopy ? 'btnrow' : ''}">` +
            `<a class="btn">保存图片</a>` +
            (canCopy ? `<button class="btn ghost" type="button">复制图片</button>` : '') +
          `</div>`;
        card.querySelector('img.thumb').src = url;
        const dl = card.querySelector('a.btn');
        dl.href = url;
        dl.download = outName;
        if (canCopy) {
          const cp = card.querySelector('button.btn');
          cp.addEventListener('click', async () => {
            try {
              await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
              cp.textContent = '已复制';
              setTimeout(() => { cp.textContent = '复制图片'; }, 1500);
            } catch (err) {
              cp.textContent = '复制失败';
            }
          });
        }
        encOut.appendChild(card);
      }
    } catch (e) {
      showEncErr(e.message || String(e));
    } finally {
      encBusy.classList.remove('show');
    }
  }

  encDrop.addEventListener('click', () => encFile.click());
  encFile.addEventListener('change', e => { handleEncodeFile(e.target.files[0]); encFile.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => encDrop.addEventListener(ev, e => { e.preventDefault(); encDrop.classList.add('hot'); }));
  ['dragleave', 'drop'].forEach(ev => encDrop.addEventListener(ev, e => { e.preventDefault(); encDrop.classList.remove('hot'); }));
  encDrop.addEventListener('drop', e => handleEncodeFile(e.dataTransfer.files[0]));
})();
</script>
